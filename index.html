<style>
/* Layout: navy side rail (brand), off-white working canvas; bottom tab bar under 900px. */

}

  --accent:#D9C197; --accent-fg:#0A1A3A; --gold:#D9C197;
  --good:#5CC49A; --warn:#E0B04F; --bad:#EE8F7C; --good-bg:#12332A; --warn-bg:#3A2D12; --bad-bg:#40201B; --info-bg:#172544;

  --glass:rgba(18,32,62,.46); --glass-strong:rgba(12,24,48,.84); --glass-line:rgba(217,193,151,.17); --inp:rgba(255,255,255,.06);
  --glass-shadow:0 8px 32px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.07);

:root[data-theme="dark"]{
  --bg:#060D1C; --surface:#0E1A33; --surface2:#152443; --fg:#F1EEE6; --muted:#98A4BC; --line:#23334F;
  --accent:#D9C197; --accent-fg:#0A1A3A; --gold:#D9C197;
  --good:#5CC49A; --warn:#E0B04F; --bad:#EE8F7C; --good-bg:#12332A; --warn-bg:#3A2D12; --bad-bg:#40201B; --info-bg:#172544;

  --glass:rgba(18,32,62,.46); --glass-strong:rgba(12,24,48,.84); --glass-line:rgba(217,193,151,.17); --inp:rgba(255,255,255,.06);

*{box-sizing:border-box}
button,.btn,a,select,input,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:12px;min-height:180px;align-items:center}
.qr svg{width:min(240px,100%);height:auto}
.linkbox{width:100%;direction:ltr;text-align:left;font-size:13px}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.55;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--nav-bg);color:var(--nav-fg);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;align-self:start}
.logo{display:block;padding:2px 4px 16px}.logo .lg{display:block;width:100%;max-width:190px;margin:0 auto;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.35)}.top .mk{display:none;width:34px;height:34px;border-radius:9px;vertical-align:middle;margin-inline-end:8px}@media(max-width:899px){.top .mk{display:inline-block}}

.nav{display:flex;flex-direction:column;gap:2px}

main{padding:22px clamp(16px,3vw,36px) 40px;min-width:0}

.tools{display:flex;gap:8px;align-items:center}
a.btn{text-decoration:none}
.ver{font-size:11px;font-weight:500;opacity:.55;margin-inline-start:6px;vertical-align:middle}
.stsel{font:inherit;font-size:13px;padding:5px 8px;border-radius:9px;border:1px solid var(--glass-line,var(--line));background:var(--inp,var(--surface2));color:var(--fg);min-height:32px;max-width:190px;border-inline-start:4px solid var(--c,#a3aab8)}
.stsel[data-st=won]{--c:#3f9b6b}.stsel[data-st=quote]{--c:#B8955C}.stsel[data-st=sample]{--c:#A65F2D}.stsel[data-st=lost]{--c:#c0504d}.stsel[data-st=replied]{--c:#4f8fc4}.stsel[data-st=contacted]{--c:#6f86b0}
.rowact{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.pf{margin-bottom:14px}.pftiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pftile{font:inherit;color:var(--fg);text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--glass-line,var(--line));border-inline-start:5px solid var(--c);background:var(--inp,var(--surface2))}

.donutwrap{position:relative;width:150px;height:150px}.donutc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.donutc b{font-size:26px;line-height:1}.donutc small{opacity:.7;font-size:12px}
.pflegend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}

.pflegend button:hover{background:var(--inp,var(--surface2))}.pflegend i{width:10px;height:10px;border-radius:3px;display:block}.pflegend small{opacity:.65;min-width:30px;text-align:end}
.pfcats{margin-top:12px;display:flex;flex-direction:column;gap:8px}.pfrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:13px}
.pfbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px}.pfbar i{display:block;min-width:6px}
@media (max-width:700px){.pftiles{grid-template-columns:repeat(2,1fr)}.pfmain{grid-template-columns:1fr;justify-items:center}.pflegend{grid-template-columns:1fr 1fr;width:100%}.pfrow{grid-template-columns:84px 1fr}}

.lk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.lk:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}

.kpi small{display:block;color:var(--muted);font-size:12.5px}

.kpi span{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:14px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}

.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--info-bg);color:var(--fg);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select,.field input,.field select,.field textarea,.inp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;width:100%}
.filters input{flex:1;min-width:180px;width:auto}.filters select{width:auto;min-width:130px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;text-align:start}

.funnel i u{display:block;height:100%;background:var(--gold);border-radius:99px;text-decoration:none}
.funnel b{font-variant-numeric:tabular-nums;text-align:end}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;cursor:pointer;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.msg{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;direction:ltr;text-align:left;line-height:1.6;unicode-bidi:plaintext}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.bottom{display:none}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13.5px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,10,22,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(680px,100%);margin-block:auto;box-shadow:var(--shadow)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.span2{grid-column:1/-1}

.field input[dir=ltr],.field textarea[dir=ltr]{text-align:left}
.preview{grid-column:1/-1;background:var(--surface2);border-radius:10px;padding:10px 14px;font-size:13.5px}
.preview b{font-variant-numeric:tabular-nums}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}

@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,filter .15s}}

/* glass morphism: translucent surfaces over a soft colour backdrop */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.backdrop i{position:absolute;border-radius:50%}
.backdrop i:nth-child(1){width:70vmax;height:70vmax;top:-26vmax;inset-inline-start:-18vmax;background:radial-gradient(circle,var(--b1),transparent 66%)}
.backdrop i:nth-child(2){width:62vmax;height:62vmax;bottom:-24vmax;inset-inline-end:-16vmax;background:radial-gradient(circle,var(--b2),transparent 66%)}
.backdrop i:nth-child(3){width:52vmax;height:52vmax;top:28vh;inset-inline-start:34vw;background:radial-gradient(circle,var(--b3),transparent 66%)}
.app{position:relative;z-index:1}
.card,.modal,.side,.bottom,.btn,.filters input,.filters select,.field input,.field select,.field textarea,.inp,.tabs button,.preview,.msg{-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
.card{background:var(--glass);border-color:var(--glass-line);box-shadow:var(--glass-shadow)}
.modal{background:var(--glass-strong);border-color:var(--glass-line);box-shadow:var(--glass-shadow),0 24px 60px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%)}
.scrim{background:rgba(4,10,22,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.side{background:var(--nav-bg);border-inline-end:1px solid rgba(255,255,255,.08)}
.bottom{border-top:1px solid rgba(255,255,255,.1)}
.btn,.tabs button{background:var(--inp);border-color:var(--glass-line)}
.btn.primary{background:var(--accent);backdrop-filter:none;-webkit-backdrop-filter:none}
.tabs button[aria-pressed="true"]{background:var(--fg)}
.filters input,.filters select,.field input,.field select,.field textarea,.inp{background:var(--inp);border-color:var(--glass-line)}
.preview,.msg{background:var(--inp)}
.chip{background:var(--info-bg)}
.modal header,.modal footer{border-color:var(--glass-line)}
.row{border-top-color:var(--glass-line)}
.card,.modal{background-clip:padding-box}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background:var(--surface)}.modal{background:var(--surface)}.side,.bottom{background:var(--nav-bg)}}
@media (prefers-reduced-transparency:reduce){.card,.modal,.side,.bottom,.btn,.inp,.filters input,.filters select,.field input,.field select,.field textarea,.tabs button,.preview,.msg,.scrim{-webkit-backdrop-filter:none;backdrop-filter:none}.card,.modal{background:var(--surface)}.side,.bottom{background:#0A1A3A}.scrim{background:rgba(4,10,22,.6)}}
@media (max-width:899px){.card,.btn,.filters input,.filters select,.inp,.tabs button{-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%)}.modal header,.modal footer{background:var(--glass-strong)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}}

function parseCSV(txt){const rows=[];let row=[],cur='',q=false;txt=txt.replace(/^﻿/,'');

const PRICE_DEF={priceCur:'EUR',hostVideo:79,hostVideoIntro:59,host3d:149,agentReel:69,agentPack4:229};
const price=k=>{const v=set()[k];return(v===undefined||v===null||v==='')?PRICE_DEF[k]:v};
const money=n=>{const c=String(price('priceCur')||'EUR').toUpperCase();const sym={EUR:'€',USD:'$',GBP:'£'}[c];return sym?sym+n:n+' '+c};
function propBits(l){const title=l.name||'',nt=l.notes||'';const tl=title.toLowerCase(),all=(title+' '+(l.size||'')+' '+nt).toLowerCase();
  const mk=(l.market||'').split(',').map(x=>x.trim()).filter(Boolean);
  let place=mk.length>1?`${mk[0]}, ${mk[1]}`:(mk[0]||l.country||'your area');if(typeof DIST_CITIES!=='undefined'&&mk.length>1&&DIST_CITIES.includes(mk[0]))place=`${mk[1]}, ${mk[0]}`;else if(l.city&&typeof geo==='function'){const g=geo(l);place=g.region&&g.region!==g.city?`${g.city}, ${g.region}`:g.city}
  const type=/finca/.test(all)?'finca':/farm/.test(all)?'farmhouse':/studio|estudio/.test(tl)?'studio':/\bloft\b/.test(all)?'loft':/penthouse|\battic\b|ático/.test(tl)?'penthouse':/apartment|apartamento|flat|condo/.test(tl)?'apartment':/\b(house|casa|bergerie|cottage)\b/.test(tl)?'house':/villa|chalet/.test(all)?'villa':/bedroom|\bunit\b|entire (rental|place)|aparthotel|apartments?\b/.test(all)?'apartment':'property';
  const f=[];
  if(/infinity/.test(tl))f.push('infinity pool');else if(/pool|piscine/.test(tl))f.push('pool');
  if(/sea ?view|seaview|sea views/.test(tl))f.push('sea view');else if(/lake/.test(tl))f.push('lake view');else if(/beach/.test(tl))f.push('beach location');else if(/views?\b/.test(tl))f.push('views');
  if(/jacuzzi/.test(tl))f.push('jacuzzi');if(/vineyard/.test(tl))f.push('vineyard view');if(/garden/.test(tl))f.push('garden');
  const feat=f.slice(0,2).join(' and ');
  let rating=l.rating,reviews=l.reviews;if(!rating){const m=nt.match(/(\d(?:\.\d+)?)\s*\((\d+) reviews?\)/);if(m){rating=m[1];reviews=m[2]}}
  const proof=rating&&reviews?`rated ${rating} from ${reviews} reviews`:'';
  const hook=`I came across your ${type} in ${place}${proof?' ('+proof+')':''} and thought ${feat?'the '+feat+' would':'it would'} work really well in a short video tour.`;
  return{place,type,feat,proof,hook,property:`${type} in ${place}`}}
const offerLine=l=>isHost(l)?`If you like the sample, the full video tour is ${money(price('hostVideoIntro'))} (introductory price for my first clients, normally ${money(price('hostVideo'))}).`:`If you like it, regular work is ${money(price('agentReel'))} per video, or 4 videos for ${money(price('agentPack4'))}.`;
function fill(str,l){const s=set();const first=(l.contactName||'').trim().split(/\s+/)[0];const pb=propBits(l);
  const map={greet:first?`Hi ${first},`:'Hello,',name:first||(isHost(l)?'there':(l.name||'there')),agency:l.name||'your agency',market:l.market||'',sender:s.senderName||'[YOUR NAME]',brand:s.brand,listing:l.listingUrl||'your property',
   hook:pb.hook,listingName:l.name||'your property',city:(l.market||'').split(',')[0].trim()||pb.place,place:pb.place,property:pb.property,feat:pb.feat,proof:pb.proof,offer:offerLine(l),price:money(price('hostVideoIntro')),cur:String(price('priceCur'))};
  return String(str||'').replace(/\{\{(\w+)\}\}/g,(m,k)=>k in map?map[k]:m)}

function due(l){if(l.dnc||l.stage!=='contacted'||!l.lastSent)return null;const st=l.step||0;if(st<1||st>=maxSteps(l))return null;
  const d=new Date(l.lastSent);d.setDate(d.getDate()+gapDays(l,st));return d}
function readyFirst(l){if(l.dnc||(l.step||0)>0)return false;if(!['new','researched'].includes(l.stage))return false;
  return routeOf(l)!=='none'}
function sentToday(){const k=dayKey(new Date());return list('logs').filter(x=>x.type==='sent'&&dayKey(x.ts)===k).length}
function payCalc(p){const gross=num(p.gross);const fee=p.feeMode==='percent'?gross*num(p.fee)/100:num(p.fee);const net=gross-fee;const rate=num(p.rate);
  const invUsd=num(p.invoiced)*(num(p.fx)||1);return {gross,fee,net,toman:net*rate,leak:invUsd>0&&gross>0?1-net/invUsd:null,feePct:gross>0?fee/gross*100:0}}

/* ---------- modal + forms ---------- */
function closeModal(){$('#modal-root').innerHTML=''}
function openForm({title,fields,values={},onSave,onDelete,preview,extra='',onChange}){
  const root=$('#modal-root');const id='mf';
  const fh=fields.map(f=>{const v=values[f.k]??'';const fid='f_'+f.k;const lab=`<label for="${fid}">${esc(f.label)}</label>`;
    const dirA=f.ltr?' dir="ltr"':'';
    if(f.type==='check')return `<div class="field check span2" data-fk="${f.k}"><input id="${fid}" type="checkbox" ${v?'checked':''}><label for="${fid}" style="font-size:14px;color:var(--fg)">${esc(f.label)}</label></div>`;
    let ctl;
    if(f.type==='select')ctl=`<select id="${fid}">${f.opts.map(([a,b])=>`<option value="${esc(a)}" ${String(v)===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')ctl=`<textarea id="${fid}" rows="${f.rows||4}"${dirA}>${esc(v)}</textarea>`;
    else if(f.type==='file')ctl=`<input id="${fid}" type="file" accept="image/*,application/pdf">`;
    else ctl=`<input id="${fid}" type="${f.type||'text'}" ${f.type==='number'?'step="any" inputmode="decimal"':''} value="${esc(v)}"${dirA}${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
    return `<div class="field ${f.span?'span2':''}" data-fk="${f.k}">${lab}${ctl}</div>`}).join('');
  root.innerHTML=`<div class="scrim" id="scrim"><div class="modal" id="${id}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3>${esc(title)}</h3><button type="button" class="btn ghost sm" data-x="close">${esc(t('close'))}</button></header><div class="body">${fh}<div class="preview" id="mf_prev" hidden></div>${extra}<div class="help" id="mf_err" role="alert" style="grid-column:1/-1;color:#e0605a"></div></div><footer><button class="btn primary" type="button" data-x="save">${esc(t('save'))}</button>${onDelete?`<button class="btn danger" type="button" data-x="del">${esc(t('delete'))}</button>`:''}<button class="btn" type="button" data-x="close">${esc(t('cancel'))}</button></footer></div></div>`;
  const form=$('#'+id);
  const read=()=>{const o={};fields.forEach(f=>{const el=$('#f_'+f.k);if(!el)return;o[f.k]=f.type==='check'?el.checked:f.type==='file'?el.files[0]||null:el.value});return o};
  const upd=()=>{if(!preview)return;const h=preview(read());const p=$('#mf_prev');p.hidden=!h;p.innerHTML=h||''};
  const vis=()=>{const v=read();fields.forEach(f=>{if(f.showIf){const w=form.querySelector(`[data-fk="${f.k}"]`)||$('#f_'+f.k)?.closest('.field');if(w)w.hidden=!f.showIf(v)}})};
  form.addEventListener('input',upd);form.addEventListener('change',e=>{upd();if(onChange){onChange(e.target.id.slice(2),read(),(k,val)=>{const el=$('#f_'+k);if(el)el.value=val});}vis()});upd();vis();
  let armed=false;
  form.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;
    if(x.dataset.x==='close')closeModal();
    if(x.dataset.x==='save')doSave();
    if(x.dataset.x==='del'){if(!armed){armed=true;x.textContent=t('confirm_del');return}onDelete();closeModal()}});
  $('#scrim').addEventListener('mousedown',e=>{if(e.target.id==='scrim')closeModal()});
  let busy=false;const doSave=async()=>{if(busy)return;busy=true;const btn=form.querySelector('[data-x=save]'),er=$('#mf_err');if(btn)btn.disabled=true;if(er)er.textContent='';
    try{await onSave(read());closeModal();toast(t('saved'))}catch(err){busy=false;if(btn)btn.disabled=false;const m=t('err')+': '+((err&&(err.message||err.code))||'');if(er)er.textContent=m;toast(m,7000)}};
  form.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!['file','checkbox'].includes(e.target.type)){e.preventDefault();doSave()}});
  form._save=doSave;
  const first=form.querySelector('input,select,textarea');if(first&&first.type!=='file'&&matchMedia('(min-width:900px)').matches)first.focus();
}

const GH='https://api.github.com',SCOLS=['leads','logs','projects','payments','templates','settings'];
const SYNC={cfg:null,status:'off',last:'',err:'',busy:false,dirty:false,t:null,apply:false};
(function(){try{SYNC.cfg=JSON.parse(store.get('lm_sync')||'null')}catch{}SYNC.status=SYNC.cfg?'idle':'off';SYNC.last=(SYNC.cfg&&SYNC.cfg.last)||''})();
let TOMB={};try{TOMB=JSON.parse(store.get('lm_del')||'{}')}catch{}
const tombSave=()=>store.set('lm_del',JSON.stringify(TOMB));
const syncOn=()=>!!(SYNC.cfg&&SYNC.cfg.token&&SYNC.cfg.gist&&S.mode!=='cloud');
function syncCfgSave(){store.set('lm_sync',JSON.stringify({...SYNC.cfg,last:SYNC.last}))}
class SyncErr extends Error{constructor(code,msg){super(msg||code);this.code=code}}
async function gh(path,opt={}){let r;
  try{r=await fetch(GH+path,{...opt,headers:{Authorization:'Bearer '+SYNC.cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}})}catch{throw new SyncErr('net')}
  if(r.status===401)throw new SyncErr('token');if(r.status===404)throw new SyncErr('notfound');
  if(r.status===403||r.status===429)throw new SyncErr('rate');if(!r.ok)throw new SyncErr('http',String(r.status));return r.json()}
const syncMsg=e=>({net:t('sy_e_net'),token:t('sy_e_token'),notfound:t('sy_e_notfound'),rate:t('sy_e_rate')}[e&&e.code])||(t('err')+': '+((e&&e.message)||''));
function packCols(){const f={};SCOLS.forEach(c=>f[c+'.json']={content:JSON.stringify(S.data[c]||{})});f['deleted.json']={content:JSON.stringify(TOMB)};f['meta.json']={content:JSON.stringify({app:'landmark-panel',v:1,at:nowISO()})};return f}
function mergeIn(remote){let chLocal=false;const push=new Set();const del={...remote.del};
  for(const k of Object.keys(TOMB)){if(!(k in del)||TOMB[k]>del[k]){del[k]=TOMB[k];push.add('deleted')}}
  for(const k of Object.keys(del)){if(!(k in TOMB)||del[k]>TOMB[k]){TOMB[k]=del[k];}}
  for(const c of SCOLS){const L=S.data[c],R=remote.cols[c]||{};
    for(const id of new Set([...Object.keys(L),...Object.keys(R)])){const l=L[id],r=R[id],k=c+'/'+id;
      if(del[k]){const stamp=[l&&l.updatedAt,r&&r.updatedAt].filter(Boolean).sort().pop()||'';
        if(del[k]>=stamp){if(l){delete L[id];chLocal=true}if(r)push.add(c);continue}
        delete del[k];delete TOMB[k];push.add('deleted')}
      if(l&&!r){push.add(c)}else if(r&&!l){L[id]=r;chLocal=true}
      else if((r.updatedAt||'')>(l.updatedAt||'')){L[id]=r;chLocal=true}
      else if((l.updatedAt||'')>(r.updatedAt||'')){push.add(c)}}}
  const cut=new Date(Date.now()-90*864e5).toISOString();for(const k of Object.keys(TOMB))if(TOMB[k]<cut){delete TOMB[k]}
  return{chLocal,push}}
async function syncNow(){if(!syncOn()||SYNC.busy)return;SYNC.busy=true;SYNC.status='sync';syncDraw();
  try{const g=await gh('/gists/'+SYNC.cfg.gist);const rd=async f=>{if(!f)return null;let c=f.content;if(f.truncated||c==null){const x=await fetch(f.raw_url);if(!x.ok)throw new SyncErr('http','raw');c=await x.text()}try{return JSON.parse(c)}catch{return null}};
    const remote={cols:{},del:{}};for(const c of SCOLS)remote.cols[c]=(await rd(g.files[c+'.json']))||{};remote.del=(await rd(g.files['deleted.json']))||{};
    const m=mergeIn(remote);
    if(m.chLocal){SYNC.apply=true;try{saveLocal()}finally{SYNC.apply=false}tombSave();softRender()}else tombSave();
    if(m.push.size){const all=packCols(),files={};m.push.forEach(c=>{const n=c+'.json';files[n]=all[n]});files['deleted.json']=all['deleted.json'];files['meta.json']=all['meta.json'];await gh('/gists/'+SYNC.cfg.gist,{method:'PATCH',body:JSON.stringify({files})})}
    SYNC.last=nowISO();SYNC.status='ok';SYNC.err='';syncCfgSave()}
  catch(e){SYNC.status='err';SYNC.err=syncMsg(e)}
  finally{SYNC.busy=false;syncDraw();if(SYNC.dirty){SYNC.dirty=false;syncSoon()}}}
function syncSoon(ms=2500){if(!syncOn())return;if(SYNC.busy){SYNC.dirty=true;return}clearTimeout(SYNC.t);SYNC.t=setTimeout(syncNow,ms)}
const syncBadge=()=>!syncOn()?'○':SYNC.status==='sync'?'⟳':SYNC.status==='err'?'⚠':'☁';
function syncLine(){if(!syncOn())return t('sy_off');const w=SYNC.status==='sync'?t('sy_syncing'):SYNC.status==='err'?'⚠ '+SYNC.err:'✓ '+t('sy_ok');return w+(SYNC.last?' · '+t('sy_last')+': '+new Date(SYNC.last).toLocaleString(S.lang==='fa'?'fa-IR-u-nu-latn':'en-GB'):'')}
function syncDraw(){const el=$('#sy_status');if(el)el.textContent=syncLine();const sm=document.querySelector('#title .ver');if(sm)sm.textContent='v'+VERSION+' · '+syncBadge();drawChrome()}
const codeOf=()=>'LMS1.'+btoa(JSON.stringify({t:SYNC.cfg.token,g:SYNC.cfg.gist}));
function parseCode(c){try{c=String(c||'').trim();if(!c.startsWith('LMS1.'))return null;const o=JSON.parse(atob(c.slice(5)));return o.t&&o.g?{token:o.t,gist:o.g}:null}catch{return null}}
function syncCard(){if(S.mode==='cloud')return '';const on=syncOn();

const DIST_CITIES=['Madrid','Barcelona'];
const REGION_OF={Barcelona:'Barcelona',Marbella:'Costa del Sol','Ibiza Town':'Ibiza',Dubrovnik:'Croatia','Porto Cervo':'Sardinia',Madrid:'Madrid'};
function geo(l){const m=String(l.market||l.country||'').trim();let city='',region='';let x;
  if((x=m.match(/^(.+?)\s*\((.+)\)$/))){region=x[1].trim();city=x[2].trim()}
  else if(m.includes(',')){const p=m.split(',').map(s=>s.trim());if(DIST_CITIES.includes(p[0])){region=p[0];city=p[1]||p[0]}else{city=p[0];region=REGION_OF[city]||p.slice(1).join(', ')}}
  else{city=m;region=REGION_OF[m]||m}
  if(l.city)city=String(l.city).trim();if(l.region)region=String(l.region).trim();
  return{city:city||'—',region:region||'—'}}
const cityOf=l=>geo(l).city,regionOf=l=>geo(l).region;
const geoOk=l=>{if(!S.f.region)return true;const g=geo(l);return g.region===S.f.region&&(!S.f.city||g.city===S.f.city)};
function geoBar(L){const R={};L.forEach(l=>{const g=geo(l);const r=R[g.region]||(R[g.region]={n:0,c:{}});r.n++;r.c[g.city]=(r.c[g.city]||0)+1});
  const regs=Object.entries(R).sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0]));
  if(S.f.region&&!R[S.f.region]){S.f.region='';S.f.city=''}
  const b=(act,v,label,n,on)=>`<button type="button" class="gchip ${on?'on':''}" data-act="${act}" data-v="${esc(v)}" aria-pressed="${on}">${esc(label)}${n!=null?` <i>${n}</i>`:''}</button>`;
  let h=`<div class="geo"><div class="geolab">${esc(t('geo_region'))}</div><div class="geobar">${b('geo-region','',t('geo_all'),L.length,!S.f.region)}${regs.map(([r,o])=>b('geo-region',r,r,o.n,S.f.region===r)).join('')}</div>`;
  if(S.f.region&&R[S.f.region]){const cs=Object.entries(R[S.f.region].c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
    if(cs.length>1||cs[0][0]!==S.f.region)h+=`<div class="geolab">${esc(t('geo_city'))}</div><div class="geobar">${b('geo-city','',t('geo_all_region'),R[S.f.region].n,!S.f.city)}${cs.map(([c,n])=>b('geo-city',c,c,n,S.f.city===c)).join('')}</div>`}
  return h+'</div>'}

      :`${hi}\n\nThis is my last message so I don't clutter your inbox. If a short video from one of your listings would be useful, reply "yes" at any time and I'll make the free sample. Otherwise, I wish you a great season.\n\n${sig}`}
  return{subject,body,variant:v,style}}
function msgFor(l,step){const c=l.msgCustom&&l.msgCustom[step];if(c&&(c.body||c.subject))return{subject:c.subject||'',body:c.body||'',custom:true};const b=build(l,step);return{subject:b.subject,body:b.body,custom:false}}
function qcItems(l,subject,body){const mail=styleOf(l)==='email',n=wc(body),f=facts(l);const s=String(set().senderName||'').trim();
  return[[(!!s||MC.step===9)&&!/\[YOUR NAME\]|\{\{/.test(body),t('qc_sender')],[n<=(mail?170:95),`${t('qc_len')} (${n})`],[/reply "?no"?|reply "yes"|ignore this message|No worries|Shall I go ahead|send an example|send a few examples/i.test(body),t('qc_optout')],
   [!!(f.reviews||f.angle||f.feat||f.compact||l.market),t('qc_personal')],[/[€$£]\d+|single night|one night/.test(body),t('qc_price')],[!mail||(subject&&subject.length<=70),t('qc_subject')]]}
/* ---------- state + views ---------- */
const MC={cat:'',flt:'todo',q:'',sel:null,step:0,variant:'',draft:{},tab:'compose',ed:false,dirty:false};
function mcLeads(){const now=new Date();let L=list('leads').filter(l=>!l.dnc);
  if(MC.cat)L=L.filter(l=>cat(l)===MC.cat);
  L=L.filter(geoOk);
  if(MC.q.trim()){const q=MC.q.trim().toLowerCase();L=L.filter(l=>[l.name,l.market,l.contactName,l.email,l.country].join(' ').toLowerCase().includes(q))}
  if(MC.flt==='todo')L=L.filter(l=>(due(l)&&due(l)<=now)||readyFirst(l));
  else if(MC.flt==='sent')L=L.filter(l=>(l.step||0)>0);
  const rk=l=>(due(l)&&due(l)<=now)?0:(l.stage==='won'||l.stage==='lost')?3:(l.step||0)>0?2:1;
  return L.sort((a,b)=>rk(a)-rk(b)||closeScore(b).n-closeScore(a).n||(a.name||'').localeCompare(b.name||''))}
const mcStep=l=>Math.min(maxSteps(l),Math.max(1,(l.step||0)+1));
function mcCur(){const l=S.data.leads[MC.sel];if(!l)return null;if(!MC.step||MC.stepFor!==l.id){MC.step=mcStep(l);MC.stepFor=l.id;MC.variant=''}return l}
function mcText(l){const c=l.msgCustom&&l.msgCustom[MC.step];const v=MC.variant||(c&&c.v)||build(l,1).variant;const key=`${l.id}|${MC.step}|${v}`;
  if(MC.draft[key])return{...MC.draft[key],src:'draft',key,v};
  if(c&&(c.body||c.subject)&&(!c.v||c.v===v))return{subject:c.subject||'',body:c.body||'',src:'saved',key,v};
  const b=build(l,MC.step,v);return{subject:b.subject,body:b.body,src:'auto',key,v}}
const routeLabel=l=>({email:validEmail(l.email)?l.email:'',airbnb:'Airbnb',booking:'Booking',instagram:'Instagram',site:t('r_site'),none:t('r_none')}[routeOf(l)]);
function mcRow(l){const d=due(l),late=d&&d<=new Date(),r=routeOf(l);
  return `<button type="button" class="mcrow ${MC.sel===l.id?'on':''}" data-act="mc-pick" data-id="${l.id}"><span class="mct"><b>${esc(l.name)}</b><small>${esc(cityOf(l))}${regionOf(l)!==cityOf(l)?' \u00b7 '+esc(regionOf(l)):''}</small></span><span class="mcm">${chip(t('cat_'+cat(l)))}${chip(routeLabel(l)||r,r==='none'?'bad':'')}${(l.step||0)>0?chip(`${l.step}/${maxSteps(l)}`,late?'warn':'good'):''}${late?chip(t('overdue'),'warn'):''}</span></button>`}
function mcEditor(l){const x=mcText(l),mail=styleOf(l)==='email',mx=maxSteps(l),r=routeOf(l),f=facts(l);
  const sender=String(set().senderName||'').trim();
  const why=[f.host&&f.place?`${t('why_place')}: ${f.place}`:'',f.host?`${t('why_type')}: ${f.type}`:'',f.feat?`${t('why_feat')}: ${f.feat}`:'',f.reviews?`${t('why_rev')}: ${f.rating}/${f.reviews}`:'',f.superhost?'Superhost':'',f.compact?t('why_compact'):'',f.angle?`${t('why_angle')}: ${f.angle}`:'',f.stills?t('why_stills'):''].filter(Boolean);
  const go=r==='email'?gmail(l.email,x.subject,x.body):r==='airbnb'||r==='booking'?httpUrl(l.listingUrl):r==='instagram'?igUrl(l.instagram):r==='site'?httpUrl(l.website):'';
  const goLabel={email:t('open_gmail'),airbnb:t('open_listing'),booking:t('open_listing'),instagram:'Instagram',site:t('open_site')}[r]||'';
  const qc=qcItems(l,x.subject,x.body);
  return `<div class="card mced" id="mced">
   <button type="button" class="btn ghost sm mcback" data-act="mc-back">← ${esc(t('mc_list'))}</button>
   <h2 style="margin:6px 0">${esc(l.name)}</h2>
   <div class="lk" style="margin:0 0 8px">${chip(t('cat_'+cat(l)))}${chip(t('st_'+l.stage),stageCls(l.stage))}${chip(t('chance')+' '+closeScore(l).n)}${leadLinks(l)}<button type="button" class="btn sm" data-act="lead-edit" data-id="${l.id}">${esc(t('edit'))}</button></div>
   <div class="s" style="margin:6px 0 4px">${esc(t('stage'))}:</div>${stSel(l)}
   ${why.length?`<div class="mcwhy"><b>${esc(t('why_title'))}</b> ${why.map(w=>chip(w)).join('')}</div>`:''}
   ${sender?'':`<div class="banner" style="margin:8px 0"><div style="margin-bottom:6px">${esc(t('msg_nosender'))}</div><div style="display:flex;gap:6px"><input id="mc_sender" class="inp" placeholder="${esc(t('s_sender'))}" style="flex:1"><button type="button" class="btn primary" data-act="mc-setname">${esc(t('save'))}</button></div></div>`}
   <div class="tabs" style="margin:10px 0 6px">${Array.from({length:mx},(_,i)=>`<button type="button" data-act="mc-step" data-step="${i+1}" aria-pressed="${MC.step===i+1}">${esc(t('step'))} ${i+1}${(l.step||0)>=i+1?' ✓':''}</button>`).join('')}${true?`<button type="button" data-act="mc-step" data-step="9" aria-pressed="${MC.step===9}">${esc(t('step_reply'))}</button>`:''}</div>
   ${MC.step===9?`<p class="help" style="margin:0 0 8px">${esc(t('reply_help'))}</p>`:''}
   ${false?`<div class="tabs" style="margin:0 0 8px"><span class="help" style="align-self:center">${esc(t('mc_style'))}:</span>${['A','B','C'].map(v=>`<button type="button" data-act="mc-var" data-v="${v}" aria-pressed="${x.v===v}">${esc(t('var_'+v))}</button>`).join('')}</div>`:''}
   <div class="s" style="margin-bottom:6px">${esc(t('mc_via'))}: <b>${esc(routeLabel(l)||'—')}</b>${x.src==='saved'?' · '+esc(t('msg_custom')):x.src==='draft'?' · '+esc(t('mc_draft')):''}</div>
   ${mail?`<div class="field" style="margin-bottom:8px"><label for="mc_su">${esc(t('subject'))}</label><input id="mc_su" class="inp" dir="ltr" value="${esc(x.subject)}"></div>`:''}
   <div class="field"><label for="mc_bd">${esc(t('body'))}</label><textarea id="mc_bd" class="inp" dir="ltr" rows="${mail?14:9}">${esc(x.body)}</textarea></div>
   <div class="mcqc" id="mc_qc">${qc.map(([ok,lab])=>chip((ok?'✓ ':'! ')+lab,ok?'good':'warn')).join('')}</div>
   <div class="mcact">
    <button type="button" class="btn primary" data-act="mc-copy">${esc(t('copy_body'))}</button>
    ${mail?`<button type="button" class="btn" data-act="mc-copy-su">${esc(t('copy_subject'))}</button>`:''}
    ${go?`<button type="button" class="btn" data-act="mc-open">${esc(goLabel)} ↗</button>`:''}
    <button type="button" class="btn" data-act="mc-save">${esc(t('msg_save'))}</button>
    ${x.src!=='auto'?`<button type="button" class="btn" data-act="mc-reset">${esc(t('msg_reset'))}</button>`:''}
   </div>
   <div class="mcact" style="margin-top:8px">
    <button type="button" class="btn primary" data-act="mc-sent">${esc(t('mark_sent'))}</button>
    <button type="button" class="btn" data-act="mc-reply">${esc(t('log_reply'))}</button>
    <button type="button" class="btn" data-act="mc-next">${esc(t('msg_next'))} →</button>
   </div>
   <div class="help" id="mc_err" style="color:var(--bad,#c0504d);margin-top:8px" role="alert"></div>
   <p class="help" style="margin:8px 0 0">${esc(t('mc_help'))}</p></div>`}
function vMail(){
  const tabs=`<div class="tabs"><button type="button" aria-pressed="${MC.tab==='compose'}" data-act="mc-tab" data-tab2="compose">${esc(t('mc_compose'))}</button><button type="button" aria-pressed="${MC.tab==='history'}" data-act="mc-tab" data-tab2="history">${esc(t('q_log'))}</button></div>`;
  if(MC.tab==='history'){const lg=list('logs').sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,150);
    return tabs+`<div class="card">${lg.length?lg.map(x=>`<div class="row"><div class="grow"><div class="t">${esc(leadName(x.leadId)||'—')}</div><div class="s">${esc(t('lg_'+(x.type==='sent'?'email_sent':x.type)))}${x.text?' · '+esc(x.text):''}</div></div><span class="s">${fd(x.ts)}</span></div>`).join(''):`<div class="empty">${esc(t('log_empty'))}</div>`}</div>`}
  const L=mcLeads();if(!MC.sel||!S.data.leads[MC.sel])MC.sel=L[0]?L[0].id:null;
  const cur=mcCur();const n=sentToday();
  const filters=`<div class="tabs" style="margin-bottom:8px">${[['todo','mc_f_todo'],['sent','mc_f_sent'],['all','mc_f_all']].map(([k,l])=>`<button type="button" data-act="mc-flt" data-k="${k}" aria-pressed="${MC.flt===k}">${esc(t(l))}</button>`).join('')}</div>
   <div class="tabs" style="margin-bottom:8px"><button type="button" data-act="mc-cat" data-c="" aria-pressed="${!MC.cat}">${esc(t('all'))}</button>${CATS.map(c=>`<button type="button" data-act="mc-cat" data-c="${c}" aria-pressed="${MC.cat===c}">${esc(t('cat_'+c))}</button>`).join('')}</div>
   ${geoBar(list('leads').filter(l=>!l.dnc&&(!MC.cat||cat(l)===MC.cat)))}${geoStats(list('leads').filter(l=>!l.dnc&&(!MC.cat||cat(l)===MC.cat)))}
   <input id="mc_q" class="inp" type="search" placeholder="${esc(t('search'))}" value="${esc(MC.q)}" style="margin-bottom:8px;width:100%">`;
  return tabs+`<p class="help" style="margin:0 0 8px">${esc(t('sent_today'))}: <b>${n}/${num(set().limit)}</b> · ${esc(t('mc_count'))}: <b>${L.length}</b></p>
   <div class="mc ${MC.ed?'ed':''}"><div class="mclist"><div class="card">${filters}<div class="mcrows">${L.map(mcRow).join('')||`<div class="empty">${esc(t('nothing_ready'))}</div>`}</div></div></div>
   <div class="mcpane">${cur?mcEditor(cur):`<div class="card empty">${esc(t('pick_lead'))}</div>`}</div></div>`}
function mcNext(){const L=mcLeads();const i=L.findIndex(x=>x.id===MC.sel);const nx=L[i+1]||L[i-1]||null;return nx?nx.id:null}
function mcPick(id){MC.sel=id;MC.step=0;MC.variant='';MC.ed=true;render();window.scrollTo(0,0)}
function mcErr(m){const e=$('#mc_err');if(e)e.textContent=m||''}
async function mcDo(fn){try{mcErr('');await fn()}catch(e){mcErr(t('err')+': '+((e&&e.message)||e));toast(t('err')+': '+((e&&e.message)||e),7000)}}
function mcRead(){const l=S.data.leads[MC.sel];if(!l)return null;const su=$('#mc_su'),bd=$('#mc_bd');return{l,subject:su?su.value:'',body:bd?bd.value:''}}
function openExt(url,fallbackText){let w=null;try{w=window.open(url,'_blank')}catch{}if(w){try{w.opener=null}catch{}return true}
  if(fallbackText!==undefined){copy(fallbackText);toast(t('link_blocked_copied'),7000)}else{copy(url).then(ok=>{if(ok)toast(t('link_copied'),6000)})}return false}
document.addEventListener('input',e=>{const id=e.target.id;if(id==='mc_su'||id==='mc_bd'){const r=mcRead();if(!r)return;const x=mcText(r.l);MC.draft[x.key]={subject:r.subject,body:r.body};MC.dirty=true;
  const q=$('#mc_qc');if(q)q.innerHTML=qcItems(r.l,r.subject,r.body).map(([ok,lab])=>chip((ok?'✓ ':'! ')+lab,ok?'good':'warn')).join('')}
  if(id==='mc_q'){MC.q=e.target.value;const rows=document.querySelector('.mcrows');if(rows)rows.innerHTML=mcLeads().map(mcRow).join('')||`<div class="empty">${esc(t('nothing_ready'))}</div>`}});


/* ---------- version + auto update ---------- */
const PAGES_URL='https://landmarkvisualstudio-rgb.github.io/landmark-panel/';
const UPD={st:'idle',v:0,built:'',at:0,err:''};
const verNum=()=>parseInt(VERSION,10)||0;
const canUpd=()=>S.mode==='local';
const updUrl=()=>(window.LM_TARGET==='pages'?new URL('version.json',location.href).href:PAGES_URL+'version.json')+'?_='+Date.now();
function updMsg(){return UPD.st==='chk'?t('upd_chk'):UPD.st==='new'?'⬆ '+t('upd_new').replace('{v}',UPD.v):UPD.st==='ok'?'✓ '+t('upd_latest'):UPD.st==='err'?'⚠ '+t('upd_fail'):''}
function updBanner(){if(!canUpd()||!S.ready||UPD.st!=='new')return '';
  return `<div class="banner" style="background:rgba(184,149,92,.18);border-color:#B8955C">⬆ ${esc(t('upd_new').replace('{v}',UPD.v))} <button type="button" class="btn sm primary" data-act="upd-apply">${esc(t(window.LM_TARGET==='pages'?'upd_apply':'upd_open'))}</button></div>`}
function verCard(){const kind=window.LM_TARGET==='pages'?t('upd_k_pages'):S.mode==='cloud'?t('upd_k_cloud'):S.standalone?t('upd_k_file'):t('upd_k_art');
  let bt='';try{bt=new Date(BUILT).toLocaleString(S.lang==='fa'?'fa-IR-u-nu-latn':'en-GB',{dateStyle:'medium',timeStyle:'short'})}catch{}
  return `<div class="card"><h2>${esc(t('upd_title'))}</h2><div id="upd_body">${updBody(kind,bt)}</div></div>`}
function updBody(kind,bt){if(kind===undefined){kind=window.LM_TARGET==='pages'?t('upd_k_pages'):S.mode==='cloud'?t('upd_k_cloud'):S.standalone?t('upd_k_file'):t('upd_k_art');try{bt=new Date(BUILT).toLocaleString(S.lang==='fa'?'fa-IR-u-nu-latn':'en-GB',{dateStyle:'medium',timeStyle:'short'})}catch{bt=''}}
  return `<p style="margin:0 0 6px"><b dir="ltr">v${esc(VERSION)}</b> <span class="help">· ${esc(kind)}${bt?' · '+esc(bt):''}</span></p>`+(canUpd()?`<div class="help" id="upd_msg" style="margin:0 0 8px">${esc(updMsg())}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-act="upd-check">${esc(t('upd_check'))}</button>${UPD.st==='new'?`<button type="button" class="btn primary" data-act="upd-apply">${esc(t(window.LM_TARGET==='pages'?'upd_apply':'upd_open'))}</button>`:''}</div>`:`<p class="help" style="margin:0">${esc(t('upd_auto'))}</p>`)}
function updDraw(){drawChrome();const b=$('#upd_body');if(b)b.innerHTML=updBody()}
async function updCheck(manual){if(!canUpd())return;UPD.st='chk';if(manual)updDraw();
  try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(updUrl(),{cache:'no-store',signal:ctl.signal});clearTimeout(to);
    if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
    UPD.v=+j.v||0;UPD.built=j.built||'';UPD.at=Date.now();UPD.err='';UPD.st=UPD.v>verNum()?'new':'ok'}
  catch(e){UPD.st='err';UPD.err=(e&&e.name==='AbortError')?'timeout':((e&&e.message)||String(e))}
  updDraw();
  if(manual)toast(UPD.st==='new'?t('upd_new').replace('{v}',UPD.v):UPD.st==='ok'?t('upd_latest'):t('upd_fail'),4500)}
async function updApply(){
  if(window.LM_TARGET!=='pages'){openExt(PAGES_URL+'?v='+UPD.v,PAGES_URL);return}
  try{if(syncOn()&&SYNC.dirty)await syncNow()}catch{}
  try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}catch{}
  try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch{}
  location.replace(location.pathname+'?v='+UPD.v+'&t='+Date.now())}
setTimeout(()=>updCheck(false),4000);
setInterval(()=>{if(!document.hidden)updCheck(false)},30*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-UPD.at>10*60*1000)updCheck(false)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('foot')){e.preventDefault();S.tab='settings';render()}});

/* ---------- new lead batches published with the app (leads.json) ---------- */
const leadsUrl=()=>(window.LM_TARGET==='pages'?new URL('leads.json',location.href).href:PAGES_URL+'leads.json')+'?_='+Date.now();
async function pullBatches(){if(S.mode!=='local')return;if(!S.ready){setTimeout(pullBatches,1500);return}
  try{const r=await fetch(leadsUrl(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    let seen={};try{seen=JSON.parse(store.get('lm_batch')||'{}')||{}}catch{}
    let n=0;for(const o of Object.values((j&&j.leads)||{})){if(!o||!o.id||seen[o.id])continue;seen[o.id]=1;
      if(S.data.leads[o.id]||TOMB['leads/'+o.id])continue;S.data.leads[o.id]=o;n++}
    store.set('lm_batch',JSON.stringify(seen));
    if(n){saveLocal();render();toast(t('imported')+': '+n+' '+t('imp_new_leads'),6000)}}catch{}}
setTimeout(pullBatches,2500);
setInterval(()=>{if(!document.hidden)pullBatches()},30*60*1000);

(function(){try{const l=document.createElement('link');l.rel='icon';l.href=LOGO_FAV;document.head.appendChild(l);const m=document.createElement('meta');m.name='theme-color';m.content='#0A1A3A';document.head.appendChild(m)}catch{}})();
try{if('serviceWorker' in navigator&&window.LM_TARGET==='pages'&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch{}
Object.assign(T.fa,{cat_rental:'شرکت اجاره خانه'});Object.assign(T.en,{cat_rental:'Rental company'});

  if(w){try{w.opener=null}catch{}}else{copy(href).then(ok=>{if(ok)toast(t('link_copied'),6000)})}});
window.addEventListener('error',e=>{if(e&&e.message&&!/ResizeObserver/.test(e.message))toast(t('err')+': '+e.message,9000)});
